<svg xmlns="http://www.w3.org/2000/svg" width="480" height="170" viewBox="0 0 480 170" role="img" aria-label="SnapCal">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".07"/><stop offset=".4" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#96aac8" stop-opacity=".05"/></linearGradient>
<linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".10"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="c"><rect width="480" height="170" rx="12"/></clipPath>
</defs>
<style>
.n{font:400 12px Inter,'Segoe UI',Helvetica,Arial,sans-serif;fill:#6a6a6a;font-variant-numeric:tabular-nums}
.t{font:500 22px Inter,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:-.8px;fill:#fff}
.d{font:400 13.5px Inter,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:-.15px;fill:#9a9a9a}
.g{font:400 11.5px Inter,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:.1px;fill:#d0d0d0}
.sw{animation:sw 7s ease-in-out infinite}
@keyframes sw{0%{transform:translateX(-300px)}55%,100%{transform:translateX(560px)}}
</style>
<g clip-path="url(#c)">
<rect width="480" height="170" fill="#050505"/><rect width="480" height="170" fill="url(#bg)"/>
<rect class="sw" x="0" y="0" width="220" height="170" fill="url(#sh)" transform="skewX(-18)"/>
<text class="n" x="26" y="36">05</text>
<text class="t" x="26" y="68">SnapCal</text>
<text class="d" x="26" y="96">Snap a photo of your meal and get AI-powered</text>
<text class="d" x="26" y="116">calorie and nutrition analysis.</text>
<line x1="26" y1="132" x2="454" y2="132" stroke="#fff" stroke-opacity=".12"/>
<text class="g" x="26" y="153">Expo  ·  React Native  ·  TypeScript</text>
<path d="M440 30l12-12m0 0h-8m8 0v8" stroke="#9a9a9a" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<rect x=".5" y=".5" width="479" height="169" rx="11.5" fill="none" stroke="#fff" stroke-opacity=".16"/>
</svg>
